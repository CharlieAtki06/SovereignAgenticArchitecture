name: Evidence pin staleness

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-pins:
    name: Compare evidence pins with default branches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the root repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compare pins without changing them
        env:
          ZONE_EVIDENCE_READ_TOKEN: ${{ secrets.ZONE_EVIDENCE_READ_TOKEN }}
        run: node scripts/check-evidence-staleness.mjs
